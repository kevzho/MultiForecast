name: Daily Refresh (PL + World Cup)

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install papermill

      - name: Run refresh pipeline
        run: |
          python refresh_all.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data cache premier_league/viz/table-level-eda-output.ipynb || true
          git reset -- cache data/wc/historical || true
          git diff --cached --quiet || git commit -m "Automated daily refresh: $(date -u +%F)"
          git pull --rebase --autostash origin main
          git push
